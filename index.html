<h1>exchange-sync</h1>
<p>A personal, single-user tool that copies its owner's work calendar and mail from a Microsoft Exchange server into the owner's own Google account (Google Calendar and Gmail labels).</p>
<p>It is not offered to anyone else and runs only on the owner's private server.</p>
